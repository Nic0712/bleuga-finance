                          Switch(
                              checked = isSelfTransfer,
                              onCheckedChange = {
                                  isSelfTransfer = it
                                  if (it) selectedCategory = TransactionCategory.SELF_TRANSFER
                              }
                          )
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          OutlinedTextField(
                              value = displayName,
                              onValueChange = { displayName = it },
                              label = { Text("Merchant / Display Name") },
                              singleLine = true,
                              modifier = Modifier.weight(1.6f),
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedTextColor = Color.White,
                                  unfocusedTextColor = Color.White,
                                  focusedBorderColor = Color(0xFF38BDF8),
                                  unfocusedBorderColor = Color(0xFF3F3F46)
                              )
                          )
                          OutlinedTextField(
                              value = amountText,
                              onValueChange = { amountText = it },
                              label = { Text("RM Amount") },
                              singleLine = true,
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.weight(1f),
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedTextColor = Color.White,
                                  unfocusedTextColor = Color.White,
                                  focusedBorderColor = Color(0xFF38BDF8),
                                  unfocusedBorderColor = Color(0xFF3F3F46)
                              )
                          )
                      }

                      OutlinedTextField(
                          value = locationLabel,
                          onValueChange = { locationLabel = it },
                          label = { Text("GPS Location / Stall Area") },
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth(),
                          colors = OutlinedTextFieldDefaults.colors(
                              focusedTextColor = Color.White,
                              unfocusedTextColor = Color.White,
                              focusedBorderColor = Color(0xFF38BDF8),
                              unfocusedBorderColor = Color(0xFF3F3F46)
                          )
                      )

                      Text("From Account", color = Color(0xFFA1A1AA), fontSize = 12.sp)
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          accounts.forEach { acc ->
                              val selected = acc.id == sourceAccountId
                              FilterChip(
                                  selected = selected,
                                  onClick = { sourceAccountId = acc.id },
                                  label = { Text(acc.name.take(10), fontSize = 11.sp) }
                              )
                          }
                      }

                      if (isSelfTransfer) {
                          Text("To Destination Account", color = Color(0xFF38BDF8), fontSize = 12.sp)
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              accounts.filter { it.id != sourceAccountId }.forEach { acc ->
                                  val selected = acc.id == destinationAccountId
                                  FilterChip(
                                      selected = selected,
                                      onClick = { destinationAccountId = acc.id },
                                      label = { Text(acc.name.take(10), fontSize = 11.sp) }
                                  )
                              }
                          }
                      }

                      Text("Tap Category Symbol", color = Color(0xFFA1A1AA), fontSize = 12.sp)
                      LazyVerticalGrid(
                          columns = GridCells.Fixed(3),
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(175.dp),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          items(TransactionCategory.entries) { cat ->
                              val isSelected = selectedCategory == cat
                              Row(
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(10.dp))
                                      .background(
                                          if (isSelected) Color(cat.colorHex).copy(alpha = 0.25f)
                                          else Color(0xFF09090B)
                                      )
                                      .border(
                                          width = 1.dp,
                                          color = if (isSelected) Color(cat.colorHex) else Color(0xFF27272A),
                                          shape = RoundedCornerShape(10.dp)
                                      )
                                      .clickable {
                                          selectedCategory = cat
                                          isSelfTransfer = (cat == TransactionCategory.SELF_TRANSFER)
                                      }
                                      .padding(horizontal = 8.dp, vertical = 10.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  Text(text = cat.symbol, fontSize = 16.sp)
                                  Text(
                                      text = cat.displayName.substringBefore(" "),
                                      color = Color.White,
                                      fontSize = 11.sp,
                                      maxLines = 1
                                  )
                              }
                          }
                      }

                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.clickable { rememberRuleForFuture = !rememberRuleForFuture }
                      ) {
                          Checkbox(
                              checked = rememberRuleForFuture,
                              onCheckedChange = { rememberRuleForFuture = it }
                          )
                          Text(
                              text = "Auto-apply this name & category to '${transaction.rawMerchantOrRecipient.take(22)}' in future notifications & imports",
                              color = Color(0xFFD4D4D8),
                              fontSize = 12.sp
                          )
                      }

                      Button(
                          onClick = {
                              val parsedAmt = amountText.toDoubleOrNull() ?: transaction.amount
                              val newType = when {
                                  isSelfTransfer -> TransactionType.TRANSFER.name
                                  selectedCategory == TransactionCategory.INCOME -> TransactionType.INCOME.name
                                  else -> TransactionType.EXPENSE.name
                              }
                              val updated = transaction.copy(
                                  displayName = displayName.trim().ifBlank { transaction.displayName },
                                  amount = parsedAmt,
                                  locationLabel = locationLabel.trim().ifBlank { null },
                                  category = selectedCategory.name,
                                  isSelfTransfer = isSelfTransfer,
                                  transactionType = newType,
                                  sourceAccountId = sourceAccountId,
                                  destinationAccountId = if (isSelfTransfer) destinationAccountId else null
                              )
                              onSave(updated, rememberRuleForFuture)
                          },
                          modifier = Modifier.fillMaxWidth(),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981))
                      ) {
                          Text("Save Changes", color = Color.Black, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }
          ''',

              "app/src/main/java/com/nicholas/financetracker/ui/BulkImportDialog.kt": r'''package com.nicholas.financetracker.ui

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.nicholas.financetracker.data.local.TransactionCategory
          import com.nicholas.financetracker.data.remote.ExtractedTransactionDto

          data class ImportCandidateItem(
              val dto: ExtractedTransactionDto,
              val isDuplicate: Boolean,
              val selectedToImport: Boolean = !isDuplicate
          )

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun BulkImportDialog(
              candidates: List<ImportCandidateItem>,
              isLoading: Boolean,
              errorMessage: String?,
              onToggleSelect: (index: Int) -> Unit,
              onCycleCategory: (index: Int) -> Unit,
              onConfirmImport: () -> Unit,
              onDismiss: () -> Unit
          ) {
              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  containerColor = Color(0xFF18181B)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 18.dp)
                          .padding(bottom = 28.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Text(
                          text = "Gemini 3.8 Flash Bulk Importer",
                          color = Color.White,
                          fontSize = 18.sp,
                          fontWeight = FontWeight.Bold
                      )

                      when {
                          isLoading -> {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .height(220.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                      CircularProgressIndicator(color = Color(0xFF38BDF8))
                                      Spacer(modifier = Modifier.height(12.dp))
                                      Text(
                                          text = "Gemini 3.8 Flash is parsing statements, detecting self-transfers & deduplicating...",
                                          color = Color(0xFFA1A1AA),
                                          fontSize = 13.sp
                                      )
                                  }
                              }
                          }

                          errorMessage != null -> {
                              Text(
                                  text = errorMessage,
                                  color = Color(0xFFF43F5E),
                                  fontSize = 13.sp
                              )
                          }

                          else -> {
                              val totalFound = candidates.size
                              val duplicateCount = candidates.count { it.isDuplicate }
                              val selectedCount = candidates.count { it.selectedToImport }

                              Text(
                                  text = "Found $totalFound transactions ($duplicateCount duplicates auto-skipped). Tap category badge to cycle.",
                                  color = Color(0xFFA1A1AA),
                                  fontSize = 12.sp
                              )

                              LazyColumn(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .heightIn(max = 380.dp),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  itemsIndexed(candidates) { idx, item ->
                                      val cat = TransactionCategory.fromNameOrDefault(item.dto.category)
                                      Row(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .clip(RoundedCornerShape(10.dp))
                                              .background(Color(0xFF09090B))
                                              .border(
                                                  1.dp,
                                                  if (item.isDuplicate) Color(0xFF52525B) else Color(0xFF27272A),
                                                  RoundedCornerShape(10.dp)
                                              )
                                              .padding(10.dp),
                                          verticalAlignment = Alignment.CenterVertically,
                                          horizontalArrangement = Arrangement.SpaceBetween
                                      ) {
                                          Row(
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                                              modifier = Modifier.weight(1f)
                                          ) {
                                              Checkbox(
                                                  checked = item.selectedToImport,
                                                  onCheckedChange = { onToggleSelect(idx) }
                                              )
                                              Box(
                                                  modifier = Modifier
                                                      .clip(RoundedCornerShape(8.dp))
                                                      .background(Color(cat.colorHex).copy(alpha = 0.2f))
                                                      .clickable { onCycleCategory(idx) }
                                                      .padding(horizontal = 8.dp, vertical = 6.dp)
                                              ) {
                                                  Text(text = cat.symbol, fontSize = 16.sp)
                                              }
                                              Column {
                                                  Text(
                                                      text = item.dto.cleanDisplayName,
                                                      color = Color.White,
                                                      fontSize = 13.sp,
                                                      fontWeight = FontWeight.Medium,
                                                      maxLines = 1
                                                  )
                                                  Text(
                                                      text = buildString {
                                                          append(item.dto.isoDate.take(10))
                                                          append(" • ")
                                                          append(item.dto.sourceAccountName)
                                                          if (item.isDuplicate) append(" • [DUPLICATE]")
                                                      },
                                                      color = if (item.isDuplicate) Color(0xFFF59E0B) else Color(0xFF71717A),
                                                      fontSize = 11.sp
                                                  )
                                              }
                                          }

                                          Text(
                                              text = "RM %.2f".format(item.dto.amountInMyr),
                                              color = if (item.dto.isSelfTransfer) Color(0xFF38BDF8) else Color.White,
                                              fontWeight = FontWeight.Bold,
                                              fontSize = 13.sp
                                          )
                                      }
                                  }
                              }

                              Button(
                                  onClick = onConfirmImport,
                                  enabled = selectedCount > 0,
                                  modifier = Modifier.fillMaxWidth(),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF10B981))
                              ) {
                                  Text(
                                      text = "Confirm & Import $selectedCount Transactions",
                                      color = Color.Black,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }
                      }
                  }
              }
          }
          ''',

              "app/src/main/java/com/nicholas/financetracker/ui/DashboardScreen.kt": r'''package com.nicholas.financetracker.ui

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.FileUpload
          import androidx.compose.material.icons.filled.Key
          import androidx.compose.material.icons.filled.LocationOn
          import androidx.compose.material.icons.filled.Security
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.nicholas.financetracker.data.local.*
          import java.time.Instant
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun DashboardScreen(
              accounts: List<AccountEntity>,
              transactions: List<TransactionEntity>,
              selectedAccountId: Long?,
              isNotificationListenerEnabled: Boolean,
              onSelectAccount: (Long?) -> Unit,
              onOpenBankModeSettings: () -> Unit,
              onOpenDeveloperSettings: () -> Unit,
              onOpenApiKeyDialog: () -> Unit,
              onTriggerBulkImport: () -> Unit,
              onOpenQuickAdd: () -> Unit,
              onTransactionClick: (TransactionEntity) -> Unit
          ) {
              val filteredTransactions = remember(transactions, selectedAccountId) {
                  if (selectedAccountId == null) {
                      transactions
                  } else {
                      transactions.filter {
                          it.sourceAccountId == selectedAccountId || it.destinationAccountId == selectedAccountId
                      }
                  }
              }

              val displayedBalance = remember(accounts, selectedAccountId) {
                  if (selectedAccountId == null) {
                      accounts.sumOf { it.balance }
                  } else {
                      accounts.find { it.id == selectedAccountId }?.balance ?: 0.0
                  }
              }

              val totalMonthlyExpense = remember(filteredTransactions) {
                  filteredTransactions
                      .filter { !it.isSelfTransfer && it.transactionType == TransactionType.EXPENSE.name }
                      .sumOf { it.amount }
              }

              val totalMonthlyIncome = remember(filteredTransactions) {
                  filteredTransactions
                      .filter { !it.isSelfTransfer && it.transactionType == TransactionType.INCOME.name }
                      .sumOf { it.amount }
              }

              val categoryBreakdown = remember(filteredTransactions) {
                  val expenses = filteredTransactions.filter {
                      !it.isSelfTransfer && it.transactionType == TransactionType.EXPENSE.name
                  }
                  val sum = expenses.sumOf { it.amount }.coerceAtLeast(1.0)
                  expenses
                      .groupBy { TransactionCategory.fromNameOrDefault(it.category) }
                      .mapValues { (_, list) -> (list.sumOf { it.amount } / sum).toFloat() }
                      .toList()
                      .sortedByDescending { it.second }
              }

              val groupedByDate = remember(filteredTransactions) {
                  val formatter = DateTimeFormatter.ofPattern("EEE, dd MMM yyyy")
                  filteredTransactions.groupBy { tx ->
                      Instant.ofEpochMilli(tx.timestamp)
                          .atZone(ZoneId.systemDefault())
                          .toLocalDate()
                          .format(formatter)
                  }
              }

              val accountMap = remember(accounts) { accounts.associateBy { it.id } }

              Scaffold(
                  containerColor = Color(0xFF09090B),
                  floatingActionButton = {
                      FloatingActionButton(
                          onClick = onOpenQuickAdd,
                          containerColor = Color(0xFF10B981),
                          contentColor = Color.Black
                      ) {
                          Icon(Icons.Default.Add, contentDescription = "Log Cash / Test Notification")
                      }
                  }
              ) { paddingValues ->
                  LazyColumn(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(paddingValues)
                          .padding(horizontal = 16.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp),
                      contentPadding = PaddingValues(top = 16.dp, bottom = 92.dp)
                  ) {
                      item {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column {
                                  Text(
                                      text = "PULSE LEDGER • 3.8 FLASH",
                                      color = Color.White,
                                      fontSize = 17.sp,
                                      fontWeight = FontWeight.ExtraBold,
                                      letterSpacing = 1.sp
                                  )
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                                      modifier = Modifier.clickable { onOpenBankModeSettings() }
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .size(8.dp)
                                              .clip(CircleShape)
                                              .background(
                                                  if (isNotificationListenerEnabled) Color(0xFF10B981)
                                                  else Color(0xFFF59E0B)
                                              )
                                      )
                                      Text(
                                          text = if (isNotificationListenerEnabled) "Listener Active (Tap to Pause)"
                                          else "Listener Paused (Tap to Enable)",
                                          color = Color(0xFFA1A1AA),
                                          fontSize = 11.sp
                                      )
                                  }
                              }

                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  IconButton(
                                      onClick = onTriggerBulkImport,
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(Color(0xFF18181B))
                                          .border(1.dp, Color(0xFF27272A), RoundedCornerShape(10.dp))
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.FileUpload,
                                          contentDescription = "Import History",
                                          tint = Color(0xFF38BDF8)
                                      )
                                  }
                                  IconButton(
                                      onClick = onOpenDeveloperSettings,
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(Color(0xFF18181B))
                                          .border(1.dp, Color(0xFF27272A), RoundedCornerShape(10.dp))
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.Security,
                                          contentDescription = "Dev Options Shortcut",
                                          tint = Color(0xFFA1A1AA)
                                      )
                                  }
                                  IconButton(
                                      onClick = onOpenApiKeyDialog,
                                      modifier = Modifier
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(Color(0xFF18181B))
                                          .border(1.dp, Color(0xFF27272A), RoundedCornerShape(10.dp))
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.Key,
                                          contentDescription = "Gemini API Key",
                                          tint = Color(0xFFFBBF24)
                                      )
                                  }
                              }
                          }
                      }

                      item {
                          LazyRow(
                              horizontalArrangement = Arrangement.spacedBy(8.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              item {
                                  AccountPill(
                                      title = "All Accounts",
                                      subtitle = "RM %.2f".format(accounts.sumOf { it.balance }),
                                      isSelected = selectedAccountId == null,
                                      onClick = { onSelectAccount(null) }
                                  )
                              }
                              items(accounts) { acc ->
                                  AccountPill(
                                      title = acc.name,
                                      subtitle = "RM %.2f".format(acc.balance),
                                      isSelected = selectedAccountId == acc.id,
                                      onClick = { onSelectAccount(acc.id) }
                                  )
                              }
                          }
                      }

                      item {
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(16.dp))
                                  .background(Color(0xFF18181B))
                                  .border(1.dp, Color(0xFF27272A), RoundedCornerShape(16.dp))
                                  .padding(18.dp),
                              verticalArrangement = Arrangement.spacedBy(14.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.Bottom
                              ) {
                                  Column {
                                      Text(
                                          text = if (selectedAccountId == null) "CONSOLIDATED BALANCE"
                                          else accountMap[selectedAccountId]?.name?.uppercase().orEmpty(),
                                          color = Color(0xFF71717A),
                                          fontSize = 11.sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                      Text(
                                          text = "RM %.2f".format(displayedBalance),
                                          color = Color.White,
                                          fontSize = 28.sp,
                                          fontWeight = FontWeight.ExtraBold
                                      )
                                  }
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text(
                                          text = "-RM %.2f Spend".format(totalMonthlyExpense),
                                          color = Color(0xFFF43F5E),
                                          fontSize = 13.sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                      Text(
                                          text = "+RM %.2f Income".format(totalMonthlyIncome),
                                          color = Color(0xFF10B981),
                                          fontSize = 12.sp
                                      )
                                  }
                              }

                              if (categoryBreakdown.isNotEmpty()) {
                                  Canvas(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(10.dp)
                                          .clip(RoundedCornerShape(5.dp))
                                  ) {
                                      var startX = 0f
                                      categoryBreakdown.forEach { (cat, ratio) ->
                                          val segmentWidth = size.width * ratio
                                          drawRect(
                                              color = Color(cat.colorHex),
                                              topLeft = Offset(startX, 0f),
                                              size = Size(segmentWidth, size.height)
                                          )
                                          startX += segmentWidth
                                      }
                                  }

                                  LazyRow(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                      items(categoryBreakdown.take(5)) { (cat, ratio) ->
                                          Row(
                                              verticalAlignment = Alignment.CenterVertically,
                                              horizontalArrangement = Arrangement.spacedBy(4.dp)
                                          ) {
                                              Text(text = cat.symbol, fontSize = 12.sp)
                                              Text(
                                                  text = "${(ratio * 100).toInt()}%",
                                                  color = Color(0xFFD4D4D8),
                                                  fontSize = 11.sp,
                                                  fontWeight = FontWeight.Medium
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }

                      if (groupedByDate.isEmpty()) {
                          item {
                              Box(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 48.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(
                                      text = "No transactions yet. Pay with QR/Card, tap Upload to bulk-import past statements, or tap + to test.",
                                      color = Color(0xFF71717A),
                                      fontSize = 13.sp
                                  )
                              }
                          }
                      } else {
                          groupedByDate.forEach { (dateHeader, dayTransactions) ->
                              item {
                                  Text(
                                      text = dateHeader.uppercase(),
                                      color = Color(0xFF71717A),
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.Bold,
                                      modifier = Modifier.padding(top = 6.dp)
                                  )
                              }
                              items(dayTransactions, key = { it.id }) { tx ->
                                  TransactionRowCard(
                                      tx = tx,
                                      accountMap = accountMap,
                                      onClick = { onTransactionClick(tx) }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun AccountPill(
              title: String,
              subtitle: String,
              isSelected: Boolean,
              onClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .clip(RoundedCornerShape(12.dp))
                      .background(if (isSelected) Color(0xFF27272A) else Color(0xFF18181B))
                      .border(
                          width = 1.dp,
                          color = if (isSelected) Color.White else Color(0xFF27272A),
                          shape = RoundedCornerShape(12.dp)
                      )
                      .clickable(onClick = onClick)
                      .padding(horizontal = 14.dp, vertical = 10.dp)
              ) {
                  Text(
                      text = title,
                      color = Color.White,
                      fontSize = 12.sp,
                      fontWeight = FontWeight.SemiBold
                  )
                  Text(
                      text = subtitle,
                      color = Color(0xFFA1A1AA),
                      fontSize = 11.sp
                  )
              }
          }

          @Composable
          private fun TransactionRowCard(
              tx: TransactionEntity,
              accountMap: Map<Long, AccountEntity>,
              onClick: () -> Unit
          ) {
              val category = TransactionCategory.fromNameOrDefault(tx.category)
              val srcName = accountMap[tx.sourceAccountId]?.name ?: "Account"
              val dstName = tx.destinationAccountId?.let { accountMap[it]?.name }

              val amountColor = when {
                  tx.isSelfTransfer -> Color(0xFF38BDF8)
                  tx.transactionType == TransactionType.INCOME.name -> Color(0xFF10B981)
                  else -> Color(0xFFF43F5E)
              }

              val amountPrefix = when {
                  tx.isSelfTransfer -> "🔄 "
                  tx.transactionType == TransactionType.INCOME.name -> "+"
                  else -> "-"
              }

              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(14.dp))
                      .background(Color(0xFF18181B))
                      .border(1.dp, Color(0xFF27272A), RoundedCornerShape(14.dp))
                      .clickable(onClick = onClick)
                      .padding(horizontal = 14.dp, vertical = 12.dp),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      modifier = Modifier.weight(1f)
                  ) {
                      Box(
                          modifier = Modifier
                              .size(42.dp)
                              .clip(RoundedCornerShape(10.dp))
                              .background(Color(category.colorHex).copy(alpha = 0.18f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(text = category.symbol, fontSize = 20.sp)
                      }

                      Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {
                          Text(
                              text = tx.displayName,
                              color = Color.White,
                              fontSize = 14.sp,
                              fontWeight = FontWeight.SemiBold,
                              maxLines = 1
                          )

                          if (!tx.locationLabel.isNullOrBlank()) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(3.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.LocationOn,
                                      contentDescription = null,
                                      tint = Color(0xFF38BDF8),
                                      modifier = Modifier.size(12.dp)
                                  )
                                  Text(
                                      text = tx.locationLabel,
                                      color = Color(0xFF38BDF8),
                                      fontSize = 11.sp,
                                      maxLines = 1
                                  )
                              }
                          }

                          Text(
                              text = if (tx.isSelfTransfer && dstName != null) "$srcName → $dstName"
                              else "$srcName • ${category.displayName}",
                              color = Color(0xFF71717A),
                              fontSize = 11.sp
                          )
                      }
                  }

                  Column(horizontalAlignment = Alignment.End) {
                      Text(
                          text = "${amountPrefix}RM %.2f".format(tx.amount),
                          color = amountColor,
                          fontSize = 14.sp,
                          fontWeight = FontWeight.Bold
                      )
                      if (tx.originalCurrency != "MYR") {
                          Text(
                              text = "${tx.originalCurrency} %.2f".format(tx.originalAmount),
                              color = Color(0xFF71717A),
                              fontSize = 10.sp
                          )
                      }
                  }
              }
          }
          ''',

              "app/src/main/java/com/nicholas/financetracker/ui/MainActivity.kt": r'''package com.nicholas.financetracker.ui

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.lifecycle.lifecycleScope
          import com.nicholas.financetracker.data.local.*
          import com.nicholas.financetracker.data.remote.GeminiFinanceEngine
          import com.nicholas.financetracker.service.TransactionNotificationService
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {

              private val db by lazy { AppDatabase.getInstance(applicationContext) }
              private val dao by lazy { db.financeDao() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          val accounts by dao.observeAccounts().collectAsState(initial = emptyList())
                          val transactions by dao.observeAllTransactions().collectAsState(initial = emptyList())

                          var selectedAccountId by remember { mutableStateOf<Long?>(null) }
                          var editingTransaction by remember { mutableStateOf<TransactionEntity?>(null) }
                          var showApiKeyDialog by remember { mutableStateOf(false) }
                          var showQuickAddDialog by remember { mutableStateOf(false) }

                          var showBulkImportSheet by remember { mutableStateOf(false) }
                          var isBulkImporting by remember { mutableStateOf(false) }
                          var bulkImportError by remember { mutableStateOf<String?>(null) }
                          var importCandidates by remember { mutableStateOf<List<ImportCandidateItem>>(emptyList()) }

                          var isListenerEnabled by remember {
                              mutableStateOf(checkNotificationListenerEnabled())
                          }

                          val locationPermissionLauncher = rememberLauncherForActivityResult(
                              ActivityResultContracts.RequestMultiplePermissions()
                          ) { }

                          LaunchedEffect(Unit) {
                              locationPermissionLauncher.launch(
                                  arrayOf(
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                                  )
                              )
                          }

                          val bulkFilePickerLauncher = rememberLauncherForActivityResult(
                              ActivityResultContracts.OpenMultipleDocuments()
                          ) { uris: List<Uri> ->
                              if (uris.isNotEmpty()) {
                                  showBulkImportSheet = true
                                  isBulkImporting = true
                                  bulkImportError = null
                                  lifecycleScope.launch {
                                      runCatching {
                                          val apiKey = getSavedApiKey()
                                          if (apiKey.isBlank()) {
                                              throw IllegalStateException("Please tap the yellow Key icon and save your Gemini API Key first.")
                                          }
                                          val currentAccs = dao.getAllAccountsOnce()
                                          val currentRules = dao.getAllMerchantRules()
                                          val existingTxs = dao.getAllTransactionsOnce()

                                          val extractedDtos = GeminiFinanceEngine.parseStatementFiles(
                                              apiKey = apiKey,
                                              contentResolver = contentResolver,
                                              fileUris = uris,
                                              accounts = currentAccs,
                                              savedRules = currentRules
                                          )

                                          importCandidates = extractedDtos.map { dto ->
                                              val epoch = GeminiFinanceEngine.parseIsoDateToEpochMillis(dto.isoDate)
                                              val isDup = AppDatabase.isLikelyDuplicate(
                                                  candidateTimestamp = epoch,
                                                  candidateAmountMyr = dto.amountInMyr,
                                                  candidateMerchant = dto.rawMerchantOrRecipient,
                                                  existingList = existingTxs
                                              )
                                              ImportCandidateItem(dto = dto, isDuplicate = isDup)
                                          }
                                      }.onFailure { err ->
                                          bulkImportError = err.message ?: "Failed to parse statement files."
                                      }
                                      isBulkImporting = false
                                  }
                              }
                          }

                          DashboardScreen(
                              accounts = accounts,
                              transactions = transactions,
                              selectedAccountId = selectedAccountId,
                              isNotificationListenerEnabled = isListenerEnabled,
                              onSelectAccount = { selectedAccountId = it },
                              onOpenBankModeSettings = {
                                  startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                              },
                              onOpenDeveloperSettings = {
                                  runCatching {
                                      startActivity(Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS))
                                  }.onFailure {
                                      startActivity(Intent(Settings.ACTION_SETTINGS))
                                  }
                              },
                              onOpenApiKeyDialog = { showApiKeyDialog = true },
                              onTriggerBulkImport = {
                                  bulkFilePickerLauncher.launch(
                                      arrayOf("application/pdf", "text/csv", "text/comma-separated-values", "image/*")
                                  )
                              },
                              onOpenQuickAdd = { showQuickAddDialog = true },
                              onTransactionClick = { editingTransaction = it }
                          )

                          editingTransaction?.let { tx ->
                              EditTransactionSheet(
                                  transaction = tx,
                                  accounts = accounts,
                                  onDismiss = { editingTransaction = null },
                                  onSave = { updatedTx, saveRule ->
                                      lifecycleScope.launch {
                                          dao.updateTransactionAndSyncBalances(tx, updatedTx)
                                          if (saveRule) {
                                              dao.upsertMerchantRule(
                                                  MerchantRuleEntity(
                                                      normalizedRecipient = AppDatabase.normalizeRecipientKey(
                                                          updatedTx.rawMerchantOrRecipient
                                                      ),
                                                      customDisplayName = updatedTx.displayName,
                                                      assignedCategory = updatedTx.category,
                                                      forceSelfTransfer = updatedTx.isSelfTransfer,
                                                      defaultDestinationAccountId = updatedTx.destinationAccountId,
                                                      savedLatitude = updatedTx.latitude,
                                                      savedLongitude = updatedTx.longitude
                                                  )
                                              )
                                          }
                                          editingTransaction = null
                                      }
                                  },
                                  onDelete = { toDelete ->
                                      lifecycleScope.launch {
                                          dao.deleteTransactionAndSyncBalances(toDelete)
                                          editingTransaction = null
                                      }
                                  }
                              )
                          }

                          if (showBulkImportSheet) {
                              BulkImportDialog(
                                  candidates = importCandidates,
                                  isLoading = isBulkImporting,
                                  errorMessage = bulkImportError,
                                  onToggleSelect = { idx ->
                                      importCandidates = importCandidates.toMutableList().also { list ->
                                          val item = list[idx]
                                          list[idx] = item.copy(selectedToImport = !item.selectedToImport)
                                      }
                                  },
                                  onCycleCategory = { idx ->
                                      importCandidates = importCandidates.toMutableList().also { list ->
                                          val item = list[idx]
                                          val allCats = TransactionCategory.entries
                                          val cur = TransactionCategory.fromNameOrDefault(item.dto.category)
                                          val next = allCats[(allCats.indexOf(cur) + 1) % allCats.size]
                                          list[idx] = item.copy(
                                              dto = item.dto.copy(
                                                  category = next.name,
                                                  isSelfTransfer = (next == TransactionCategory.SELF_TRANSFER)
                                              )
                                          )
                                      }
                                  },
                                  onConfirmImport = {
                                      lifecycleScope.launch {
                                          val currentAccs = dao.getAllAccountsOnce()
                                          val entitiesToInsert = importCandidates
                                              .filter { it.selectedToImport }
                                              .map { item ->
                                                  val dto = item.dto
                                                  val src = currentAccs.find {
                                                      it.name.equals(dto.sourceAccountName, ignoreCase = true)
                                                  } ?: currentAccs.first()
                                                  val dst = currentAccs.find {
                                                      it.name.equals(dto.destinationAccountName, ignoreCase = true)
                                                  }
                                                  TransactionEntity(
                                                      timestamp = GeminiFinanceEngine.parseIsoDateToEpochMillis(dto.isoDate),
                                                      amount = dto.amountInMyr,
                                                      originalAmount = dto.amount,
                                                      originalCurrency = dto.currency,
                                                      rawMerchantOrRecipient = dto.rawMerchantOrRecipient,
                                                      displayName = dto.cleanDisplayName,
                                                      category = dto.category,
                                                      transactionType = if (dto.isSelfTransfer) TransactionType.TRANSFER.name else dto.transactionType,
                                                      isSelfTransfer = dto.isSelfTransfer,
                                                      sourceAccountId = src.id,
                                                      destinationAccountId = if (dto.isSelfTransfer) (dst?.id ?: 3L) else null
                                                  )
                                              }
                                          dao.bulkInsertAndSyncBalances(entitiesToInsert)
                                          showBulkImportSheet = false
                                      }
                                  },
                                  onDismiss = { showBulkImportSheet = false }
                              )
                          }

                          if (showApiKeyDialog) {
                              var keyText by remember { mutableStateOf(getSavedApiKey()) }
                              AlertDialog(
                                  onDismissRequest = { showApiKeyDialog = false },
                                  containerColor = Color(0xFF18181B),
                                  title = { Text("Gemini 3.8 Flash API Key", color = Color.White) },
                                  text = {
                                      OutlinedTextField(
                                          value = keyText,
                                          onValueChange = { keyText = it },
                                          label = { Text("Paste Google AI Studio Key") },
                                          singleLine = true
                                      )
                                  },
                                  confirmButton = {
                                      TextButton(onClick = {
                                          saveApiKey(keyText.trim())
                                          showApiKeyDialog = false
                                      }) {
                                          Text("Save Key", color = Color(0xFF10B981))
                                      }
                                  }
                              )
                          }

                          if (showQuickAddDialog) {
                              var sampleText by remember {
                                  mutableStateOf("MAE: You have paid RM 14.50 to AHMAD BIN ALI via DuitNow QR.")
                              }
                              var sampleLat by remember { mutableStateOf("1.5584") }
                              var sampleLon by remember { mutableStateOf("103.6378") }
                              var isSimulating by remember { mutableStateOf(false) }

                              AlertDialog(
                                  onDismissRequest = { if (!isSimulating) showQuickAddDialog = false },
                                  containerColor = Color(0xFF18181B),
                                  title = { Text("Log Cash or Test Gemini 3.8 + GPS", color = Color.White) },
                                  text = {
                                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                          OutlinedTextField(
                                              value = sampleText,
                                              onValueChange = { sampleText = it },
                                              label = { Text("Notification or Cash Note") }
                                          )
                                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                              OutlinedTextField(
                                                  value = sampleLat,
                                                  onValueChange = { sampleLat = it },
                                                  label = { Text("Latitude") },
                                                  modifier = Modifier.weight(1f)
                                              )
                                              OutlinedTextField(
                                                  value = sampleLon,
                                                  onValueChange = { sampleLon = it },
                                                  label = { Text("Longitude") },
                                                  modifier = Modifier.weight(1f)
                                              )
                                          }
                                      }
                                  },
                                  confirmButton = {
                                      Button(
                                          enabled = !isSimulating,
                                          onClick = {
                                              isSimulating = true
                                              lifecycleScope.launch {
                                                  val apiKey = getSavedApiKey()
                                                  val curAccs = dao.getAllAccountsOnce()
                                                  val curRules = dao.getAllMerchantRules()
                                                  val lat = sampleLat.toDoubleOrNull()
                                                  val lon = sampleLon.toDoubleOrNull()

                                                  val parsed = if (apiKey.isNotBlank()) {
                                                      GeminiFinanceEngine.parseLiveNotification(
                                                          apiKey = apiKey,
                                                          appPackage = "com.maybank2u.life",
                                                          notificationText = sampleText,
                                                          timestampMs = System.currentTimeMillis(),
                                                          lat = lat,
                                                          lon = lon,
                                                          accounts = curAccs,
                                                          savedRules = curRules
                                                      )
                                                  } else {
                                                      GeminiFinanceEngine.fallbackHeuristicParse(
                                                          "com.maybank2u.life", sampleText, "Campus Food Court"
                                                      )
                                                  }

                                                  val src = curAccs.find {
                                                      it.name.equals(parsed.sourceAccountName, ignoreCase = true)
                                                  } ?: curAccs.first()

                                                  dao.insertTransactionAndSyncBalances(
                                                      TransactionEntity(
                                                          timestamp = System.currentTimeMillis(),
                                                          amount = parsed.amountInMyr,
                                                          originalAmount = parsed.amount,
                                                          originalCurrency = parsed.currency,
                                                          rawMerchantOrRecipient = parsed.rawMerchantOrRecipient,
                                                          displayName = parsed.cleanDisplayName,
                                                          category = parsed.category,
                                                          transactionType = parsed.transactionType,
                                                          isSelfTransfer = parsed.isSelfTransfer,
                                                          sourceAccountId = src.id,
                                                          destinationAccountId = if (parsed.isSelfTransfer) 3L else null,
                                                          latitude = lat,
                                                          longitude = lon,
                                                          locationLabel = parsed.inferredLocationLabel,
                                                          rawNotificationText = sampleText
                                                      )
                                                  )
                                                  isSimulating = false
                                                  showQuickAddDialog = false
                                              }
                                          }
                                      ) {
                                          Text(if (isSimulating) "Parsing..." else "Run Gemini 3.8 + GPS")
                                      }
                                  }
                              )
                          }
                      }
                  }
              }

              private fun checkNotificationListenerEnabled(): Boolean {
                  val cn = ComponentName(this, TransactionNotificationService::class.java)
                  val flat = Settings.Secure.getString(contentResolver, "enabled_notification_listeners")
                  return flat != null && flat.contains(cn.flattenToString())
              }

              private fun getSavedApiKey(): String {
                  val prefs = getSharedPreferences(TransactionNotificationService.PREFS_NAME, Context.MODE_PRIVATE)
                  return prefs.getString(TransactionNotificationService.KEY_GEMINI_API, "") ?: ""
              }

              private fun saveApiKey(key: String) {
                  getSharedPreferences(TransactionNotificationService.PREFS_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putString(TransactionNotificationService.KEY_GEMINI_API, key)
                      .apply()
              }
          }
          '''
          }

          for rel_path, content in FILES.items():
              p = Path(rel_path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + "\n", encoding="utf-8")
          EOF

      - name: Compile Debug APK with Gradle
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk PulseFinance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulseFinance-APK
          path: PulseFinance.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pulse Finance APK (Build #${{ github.run_number }})"
          files: PulseFinance.apk