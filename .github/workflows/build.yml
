name: Build-Pulse Finance APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android Project Files
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          FILES = {
              "settings.gradle.kts": r'''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PulseFinance"
          include(":app")
          ''',

              "build.gradle.kts": r'''plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.27" apply false
          }
          ''',

              "gradle.properties": r'''org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''',

              "app/build.gradle.kts": r'''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "com.nicholas.financetracker"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.nicholas.financetracker"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

              val roomVersion = "2.6.1"
              implementation("androidx.room:room-runtime:$roomVersion")
              implementation("androidx.room:room-ktx:$roomVersion")
              ksp("androidx.room:room-compiler:$roomVersion")

              implementation("com.google.android.gms:play-services-location:21.3.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          ''',

              "app/src/main/AndroidManifest.xml": r'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nicholas.financetracker">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="Pulse Finance"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".ui.MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.TransactionNotificationService"
                      android:exported="true"
                      android:label="Pulse Transaction Listener"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          ''',

              "app/src/main/java/com/nicholas/financetracker/data/local/AppDatabase.kt": r'''package com.nicholas.financetracker.data.local

          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.launch
          import kotlin.math.abs

          enum class TransactionCategory(
              val symbol: String,
              val displayName: String,
              val colorHex: Long
          ) {
              FOOD_DINING("🍔", "Food & Dining", 0xFFF97316),
              COFFEE_DRINKS("☕", "Coffee & Beverages", 0xFFD97706),
              GROCERIES("🛒", "Groceries & Essentials", 0xFF84CC16),
              TRANSPORT_FUEL("🚗", "Transport & Fuel", 0xFF06B6D4),
              SHOPPING("🛍️", "Shopping & Lifestyle", 0xFFEC4899),
              BILLS_UTILITIES("💡", "Bills & Utilities", 0xFFEAB308),
              ENTERTAINMENT("🎬", "Entertainment & Subs", 0xFFA855F7),
              SELF_TRANSFER("🔄", "Self Transfer", 0xFF38BDF8),
              P2P_SPLIT("💸", "P2P / Split Bill", 0xFFF43F5E),
              INCOME("💰", "Income / Allowance", 0xFF10B981),
              OTHER("📦", "Other", 0xFF71717A);

              companion object {
                  fun fromNameOrDefault(name: String): TransactionCategory {
                      return entries.find { it.name.equals(name.trim(), ignoreCase = true) } ?: OTHER
                  }
              }
          }

          enum class TransactionType {
              EXPENSE, INCOME, TRANSFER
          }

          @Entity(tableName = "accounts")
          data class AccountEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val name: String,
              val balance: Double,
              val currency: String = "MYR"
          )

          @Entity(
              tableName = "transactions",
              indices = [Index(value = ["timestamp"]), Index(value = ["sourceAccountId"])]
          )
          data class TransactionEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val timestamp: Long,
              val amount: Double,
              val originalAmount: Double = amount,
              val originalCurrency: String = "MYR",
              val rawMerchantOrRecipient: String,
              val displayName: String,
              val category: String,
              val transactionType: String,
              val isSelfTransfer: Boolean,
              val sourceAccountId: Long,
              val destinationAccountId: Long? = null,
              val latitude: Double? = null,
              val longitude: Double? = null,
              val locationLabel: String? = null,
              val rawNotificationText: String? = null
          )

          @Entity(
              tableName = "merchant_rules",
              indices = [Index(value = ["normalizedRecipient"], unique = true)]
          )
          data class MerchantRuleEntity(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val normalizedRecipient: String,
              val customDisplayName: String,
              val assignedCategory: String,
              val forceSelfTransfer: Boolean = false,
              val defaultDestinationAccountId: Long? = null,
              val savedLatitude: Double? = null,
              val savedLongitude: Double? = null
          )

          @Dao
          interface FinanceDao {
              @Query("SELECT * FROM accounts ORDER BY id ASC")
              fun observeAccounts(): Flow<List<AccountEntity>>

              @Query("SELECT * FROM accounts ORDER BY id ASC")
              suspend fun getAllAccountsOnce(): List<AccountEntity>

              @Query("SELECT * FROM accounts WHERE id = :id LIMIT 1")
              suspend fun getAccountById(id: Long): AccountEntity?

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun insertAccounts(accounts: List<AccountEntity>)

              @Update
              suspend fun updateAccount(account: AccountEntity)

              @Query("SELECT * FROM transactions ORDER BY timestamp DESC")
              fun observeAllTransactions(): Flow<List<TransactionEntity>>

              @Query("SELECT * FROM transactions ORDER BY timestamp DESC")
              suspend fun getAllTransactionsOnce(): List<TransactionEntity>

              @Query("SELECT * FROM merchant_rules")
              suspend fun getAllMerchantRules(): List<MerchantRuleEntity>

              @Query("SELECT * FROM merchant_rules WHERE normalizedRecipient = :normalized LIMIT 1")
              suspend fun findRuleForRecipient(normalized: String): MerchantRuleEntity?

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertMerchantRule(rule: MerchantRuleEntity)

              @Insert
              suspend fun insertRawTransaction(tx: TransactionEntity): Long

              @Update
              suspend fun updateRawTransaction(tx: TransactionEntity)

              @Delete
              suspend fun deleteRawTransaction(tx: TransactionEntity)

              @Transaction
              suspend fun insertTransactionAndSyncBalances(tx: TransactionEntity): Long {
                  val id = insertRawTransaction(tx)
                  applyBalanceDelta(tx, revert = false)
                  return id
              }

              @Transaction
              suspend fun updateTransactionAndSyncBalances(oldTx: TransactionEntity, newTx: TransactionEntity) {
                  applyBalanceDelta(oldTx, revert = true)
                  updateRawTransaction(newTx)
                  applyBalanceDelta(newTx, revert = false)
              }

              @Transaction
              suspend fun deleteTransactionAndSyncBalances(tx: TransactionEntity) {
                  applyBalanceDelta(tx, revert = true)
                  deleteRawTransaction(tx)
              }

              @Transaction
              suspend fun bulkInsertAndSyncBalances(txList: List<TransactionEntity>) {
                  for (tx in txList) {
                      insertRawTransaction(tx)
                      applyBalanceDelta(tx, revert = false)
                  }
              }

              suspend fun applyBalanceDelta(tx: TransactionEntity, revert: Boolean) {
                  val sign = if (revert) -1.0 else 1.0
                  val type = runCatching { TransactionType.valueOf(tx.transactionType) }
                      .getOrDefault(if (tx.isSelfTransfer) TransactionType.TRANSFER else TransactionType.EXPENSE)

                  when (type) {
                      TransactionType.EXPENSE -> {
                          getAccountById(tx.sourceAccountId)?.let { acc ->
                              updateAccount(acc.copy(balance = acc.balance - (tx.amount * sign)))
                          }
                      }
                      TransactionType.INCOME -> {
                          getAccountById(tx.sourceAccountId)?.let { acc ->
                              updateAccount(acc.copy(balance = acc.balance + (tx.amount * sign)))
                          }
                      }
                      TransactionType.TRANSFER -> {
                          getAccountById(tx.sourceAccountId)?.let { src ->
                              updateAccount(src.copy(balance = src.balance - (tx.amount * sign)))
                          }
                          tx.destinationAccountId?.let { destId ->
                              getAccountById(destId)?.let { dst ->
                                  updateAccount(dst.copy(balance = dst.balance + (tx.amount * sign)))
                              }
                          }
                      }
                  }
              }
          }

          @Database(
              entities = [AccountEntity::class, TransactionEntity::class, MerchantRuleEntity::class],
              version = 1,
              exportSchema = false
          )
          abstract class AppDatabase : RoomDatabase() {
              abstract fun financeDao(): FinanceDao

              companion object {
                  @Volatile
                  private var INSTANCE: AppDatabase? = null

                  val DEFAULT_ACCOUNTS = listOf(
                      AccountEntity(id = 1, name = "Main Bank (MAE)", balance = 0.0, currency = "MYR"),
                      AccountEntity(id = 2, name = "Bank of China", balance = 0.0, currency = "MYR"),
                      AccountEntity(id = 3, name = "TNG eWallet", balance = 0.0, currency = "MYR"),
                      AccountEntity(id = 4, name = "S Pay Global", balance = 0.0, currency = "MYR"),
                      AccountEntity(id = 5, name = "Cash", balance = 0.0, currency = "MYR")
                  )

                  fun getInstance(context: Context): AppDatabase {
                      return INSTANCE ?: synchronized(this) {
                          val instance = Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "pulse_finance.db"
                          )
                              .addCallback(object : Callback() {
                                  override fun onOpen(db: androidx.sqlite.db.SupportSQLiteDatabase) {
                                      super.onOpen(db)
                                      CoroutineScope(Dispatchers.IO).launch {
                                          val dao = getInstance(context).financeDao()
                                          if (dao.getAllAccountsOnce().isEmpty()) {
                                              dao.insertAccounts(DEFAULT_ACCOUNTS)
                                          }
                                      }
                                  }
                              })
                              .build()
                          INSTANCE = instance
                          instance
                      }
                  }

                  fun normalizeRecipientKey(raw: String): String {
                      return raw.trim().uppercase().replace(Regex("\\s+"), " ")
                  }

                  fun isLikelyDuplicate(
                      candidateTimestamp: Long,
                      candidateAmountMyr: Double,
                      candidateMerchant: String,
                      existingList: List<TransactionEntity>
                  ): Boolean {
                      val eighteenHoursMs = 18 * 60 * 60 * 1000L
                      val normCand = normalizeRecipientKey(candidateMerchant)
                      return existingList.any { existing ->
                          val timeClose = abs(existing.timestamp - candidateTimestamp) <= eighteenHoursMs
                          val amountSame = abs(existing.amount - candidateAmountMyr) < 0.02
                          val existingNorm = normalizeRecipientKey(existing.rawMerchantOrRecipient)
                          val nameOverlap = existingNorm.contains(normCand.take(6)) ||
                              normCand.contains(existingNorm.take(6))
                          timeClose && amountSame && nameOverlap
                      }
                  }
              }
          }
          ''',

              "app/src/main/java/com/nicholas/financetracker/data/remote/GeminiFinanceEngine.kt": r'''package com.nicholas.financetracker.data.remote

          import android.content.ContentResolver
          import android.net.Uri
          import android.util.Base64
          import com.nicholas.financetracker.data.local.*
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import java.util.concurrent.TimeUnit

          @Serializable
          data class ParsedNotificationDto(
              val amount: Double = 0.0,
              val currency: String = "MYR",
              val amountInMyr: Double = 0.0,
              val rawMerchantOrRecipient: String = "Unknown",
              val cleanDisplayName: String = "Unknown",
              val sourceAccountName: String = "Main Bank (MAE)",
              val destinationAccountName: String? = null,
              val transactionType: String = "EXPENSE",
              val category: String = "OTHER",
              val isSelfTransfer: Boolean = false,
              val inferredLocationLabel: String? = null
          )

          @Serializable
          data class ExtractedTransactionDto(
              val isoDate: String = "2026-10-15",
              val amount: Double = 0.0,
              val currency: String = "MYR",
              val amountInMyr: Double = 0.0,
              val rawMerchantOrRecipient: String = "",
              val cleanDisplayName: String = "",
              val sourceAccountName: String = "Main Bank (MAE)",
              val destinationAccountName: String? = null,
              val transactionType: String = "EXPENSE",
              val category: String = "OTHER",
              val isSelfTransfer: Boolean = false
          )

          data class NearbyLocationContext(
              val areaName: String?,
              val poiDescriptions: List<String>
          )

          object GeminiFinanceEngine {

              private const val PRIMARY_MODEL_ID = "gemini-3.8-flash"
              private const val FALLBACK_MODEL_ID = "gemini-2.5-flash"

              private val httpClient = OkHttpClient.Builder()
                  .connectTimeout(25, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .writeTimeout(30, TimeUnit.SECONDS)
                  .build()

              private val json = Json {
                  ignoreUnknownKeys = true
                  isLenient = true
                  coerceInputValues = true
              }

              private const val OWNER_ALIASES = "Nicholas Soo Wei Ming, Nicholas Soo, Soo Wei Ming"

              suspend fun fetchNearbyOsmContext(lat: Double, lon: Double): NearbyLocationContext =
                  withContext(Dispatchers.IO) {
                      val pois = mutableListOf<String>()
                      var areaName: String? = null

                      runCatching {
                          val overpassQuery = """
                              [out:json][timeout:8];
                              (
                                node(around:100,$lat,$lon)["amenity"~"restaurant|cafe|fast_food|food_court|marketplace|fuel|college|university"];
                                way(around:100,$lat,$lon)["amenity"~"restaurant|cafe|fast_food|food_court|marketplace|fuel|college|university"];
                                node(around:100,$lat,$lon)["shop"~"convenience|supermarket|bakery|mall"];
                              );
                              out tags limit 12;
                          """.trimIndent()

                          val reqBody = "data=${java.net.URLEncoder.encode(overpassQuery, "UTF-8")}"
                              .toRequestBody("application/x-www-form-urlencoded".toMediaType())

                          val req = Request.Builder()
                              .url("https://overpass-api.de/api/interpreter")
                              .header("User-Agent", "PulseFinanceAndroid/1.0")
                              .post(reqBody)
                              .build()

                          httpClient.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val root = json.parseToJsonElement(resp.body?.string().orEmpty()).jsonObject
                                  val elements = root["elements"]?.jsonArray ?: emptyList()
                                  for (el in elements) {
                                      val tags = el.jsonObject["tags"]?.jsonObject ?: continue
                                      val name = tags["name"]?.jsonPrimitive?.contentOrNull
                                      val amenity = tags["amenity"]?.jsonPrimitive?.contentOrNull
                                          ?: tags["shop"]?.jsonPrimitive?.contentOrNull
                                      if (!name.isNullOrBlank() && !amenity.isNullOrBlank()) {
                                          pois.add("$name ($amenity)")
                                      } else if (!amenity.isNullOrBlank()) {
                                          pois.add("Unnamed $amenity")
                                      }
                                  }
                              }
                          }
                      }

                      runCatching {
                          val url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=$lat&lon=$lon&zoom=18"
                          val req = Request.Builder()
                              .url(url)
                              .header("User-Agent", "PulseFinanceAndroid/1.0")
                              .get()
                              .build()

                          httpClient.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val root = json.parseToJsonElement(resp.body?.string().orEmpty()).jsonObject
                                  val name = root["name"]?.jsonPrimitive?.contentOrNull
                                  val addr = root["address"]?.jsonObject
                                  val suburb = addr?.get("suburb")?.jsonPrimitive?.contentOrNull
                                      ?: addr?.get("neighbourhood")?.jsonPrimitive?.contentOrNull
                                      ?: addr?.get("road")?.jsonPrimitive?.contentOrNull
                                  areaName = listOfNotNull(name?.takeIf { it.isNotBlank() }, suburb)
                                      .distinct()
                                      .joinToString(", ")
                                      .ifBlank { null }
                              }
                          }
                      }

                      NearbyLocationContext(areaName = areaName, poiDescriptions = pois.distinct())
                  }

              suspend fun parseLiveNotification(
                  apiKey: String,
                  appPackage: String,
                  notificationText: String,
                  timestampMs: Long,
                  lat: Double?,
                  lon: Double?,
                  accounts: List<AccountEntity>,
                  savedRules: List<MerchantRuleEntity>
              ): ParsedNotificationDto = withContext(Dispatchers.IO) {

                  val osmContext = if (lat != null && lon != null) {
                      fetchNearbyOsmContext(lat, lon)
                  } else {
                      NearbyLocationContext(null, emptyList())
                  }

                  val accountNames = accounts.joinToString(", ") { it.name }
                  val rulesSummary = savedRules.take(50).joinToString("\n") {
                      "- If recipient matches '${it.normalizedRecipient}' -> Category: ${it.assignedCategory}, DisplayName: '${it.customDisplayName}', SelfTransfer: ${it.forceSelfTransfer}"
                  }

                  val timeFormatted = Instant.ofEpochMilli(timestampMs)
                      .atZone(ZoneId.systemDefault())
                      .format(DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm"))

                  val systemPrompt = """
                      You are an expert Malaysian & Chinese Financial Transaction Parser powered by Gemini 3.8 Flash.
                      Owner Identity & Aliases: $OWNER_ALIASES
                      Known User Accounts: $accountNames
                      Valid Categories: FOOD_DINING, COFFEE_DRINKS, GROCERIES, TRANSPORT_FUEL, SHOPPING, BILLS_UTILITIES, ENTERTAINMENT, SELF_TRANSFER, P2P_SPLIT, INCOME, OTHER.

                      User's Learned Merchant Override Rules (Apply these first if matched):
                      $rulesSummary

                      CRITICAL RULES:
                      1. SELF-TRANSFER DETECTION: If the notification shows a reload/top-up to the user's own e-wallet (e.g., TNG eWallet, S Pay Global) or a transfer where the sender/recipient is $OWNER_ALIASES or another one of the user's own accounts, set isSelfTransfer = true, transactionType = "TRANSFER", category = "SELF_TRANSFER", and identify both sourceAccountName and destinationAccountName.
                      2. PERSON-NAME QR VENDOR RESOLUTION: In Malaysia, small food stalls, campus cafes, and hawkers use personal DuitNow QR codes showing a person's name. Look at the GPS Nearby POIs and Area Name provided. If the recipient is a person's name, the amount is reasonable for food/drinks (under RM 65), and the phone is near a restaurant, cafe, food court, campus, or night market, classify as FOOD_DINING (or COFFEE_DRINKS) instead of P2P_SPLIT, and format cleanDisplayName as "[Recipient Name] @ [Best POI or Area Name]".
                      3. CURRENCY CONVERSION: If the notification is in CNY/RMB (e.g., from Bank of China), convert amountInMyr using 1 CNY = 0.61 MYR. Otherwise amountInMyr = amount.
                  """.trimIndent()

                  val userPrompt = """
                      Source App Package: $appPackage
                      Timestamp: $timeFormatted
                      Raw Notification: $notificationText
                      GPS Coordinates: ${if (lat != null) "$lat, $lon" else "Not available"}
                      Reverse Geocoded Area: ${osmContext.areaName ?: "Unknown"}
                      Nearby POIs within 100m: ${osmContext.poiDescriptions.joinToString("; ").ifBlank { "None detected" }}
                  """.trimIndent()

                  val responseSchema = buildJsonObject {
                      put("type", "OBJECT")
                      putJsonObject("properties") {
                          putJsonObject("amount") { put("type", "NUMBER") }
                          putJsonObject("currency") { put("type", "STRING") }
                          putJsonObject("amountInMyr") { put("type", "NUMBER") }
                          putJsonObject("rawMerchantOrRecipient") { put("type", "STRING") }
                          putJsonObject("cleanDisplayName") { put("type", "STRING") }
                          putJsonObject("sourceAccountName") { put("type", "STRING") }
                          putJsonObject("destinationAccountName") { put("type", "STRING"); put("nullable", true) }
                          putJsonObject("transactionType") { put("type", "STRING") }
                          putJsonObject("category") { put("type", "STRING") }
                          putJsonObject("isSelfTransfer") { put("type", "BOOLEAN") }
                          putJsonObject("inferredLocationLabel") { put("type", "STRING"); put("nullable", true) }
                      }
                      putJsonArray("required") {
                          add("amount"); add("currency"); add("amountInMyr")
                          add("rawMerchantOrRecipient"); add("cleanDisplayName")
                          add("sourceAccountName"); add("transactionType")
                          add("category"); add("isSelfTransfer")
                      }
                  }

                  val requestPayload = buildJsonObject {
                      putJsonObject("system_instruction") {
                          putJsonArray("parts") { add(buildJsonObject { put("text", systemPrompt) }) }
                      }
                      putJsonArray("contents") {
                          add(buildJsonObject {
                              put("role", "user")
                              putJsonArray("parts") { add(buildJsonObject { put("text", userPrompt) }) }
                          })
                      }
                      putJsonObject("generationConfig") {
                          put("responseMimeType", "application/json")
                          put("responseSchema", responseSchema)
                          put("temperature", 0.1)
                      }
                  }
val rawJsonText = executeGeminiCall(apiKey, requestPayload.toString())
                  val parsed = runCatching {
                      json.decodeFromString<ParsedNotificationDto>(rawJsonText)
                  }.getOrElse {
                      fallbackHeuristicParse(appPackage, notificationText, osmContext.areaName)
                  }

                  parsed.copy(
                      inferredLocationLabel = parsed.inferredLocationLabel ?: osmContext.areaName
                  )
              }

              suspend fun parseStatementFiles(
                  apiKey: String,
                  contentResolver: ContentResolver,
                  fileUris: List<Uri>,
                  accounts: List<AccountEntity>,
                  savedRules: List<MerchantRuleEntity>
              ): List<ExtractedTransactionDto> = withContext(Dispatchers.IO) {
                  if (apiKey.isBlank() || fileUris.isEmpty()) return@withContext emptyList()

                  val accountNames = accounts.joinToString(", ") { it.name }
                  val rulesSummary = savedRules.take(80).joinToString("\n") {
                      "- '${it.normalizedRecipient}' -> Category: ${it.assignedCategory}, DisplayName: '${it.customDisplayName}', SelfTransfer: ${it.forceSelfTransfer}"
                  }

                  val systemPrompt = """
                      You are an elite Financial Statement & Screenshot Batch Extractor powered by Gemini 3.8 Flash.
                      Extract EVERY individual transaction row from the attached bank/e-wallet statement(s) or transaction history screenshot(s).

                      Owner Identity & Aliases: $OWNER_ALIASES
                      Known User Accounts: $accountNames
                      Valid Categories: FOOD_DINING, COFFEE_DRINKS, GROCERIES, TRANSPORT_FUEL, SHOPPING, BILLS_UTILITIES, ENTERTAINMENT, SELF_TRANSFER, P2P_SPLIT, INCOME, OTHER.

                      Saved User Override Rules:
                      $rulesSummary

                      INSTRUCTIONS:
                      1. Extract every transaction accurately. Format isoDate as YYYY-MM-DD.
                      2. Match sourceAccountName to the user's known accounts.
                      3. Detect all e-wallet top-ups, reloads, and transfers to/from $OWNER_ALIASES or between the user's own accounts as isSelfTransfer = true, transactionType = "TRANSFER", category = "SELF_TRANSFER".
                      4. If amounts are in CNY/RMB, convert amountInMyr using 1 CNY = 0.61 MYR. If already in MYR/RM, amountInMyr = amount.
                  """.trimIndent()

                  val partsArray = buildJsonArray {
                      add(buildJsonObject {
                          put("text", "Extract all historical transactions from these uploaded statement files/screenshots into the structured JSON list.")
                      })

                      for (uri in fileUris) {
                          val mimeType = contentResolver.getType(uri) ?: "application/octet-stream"
                          val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() } ?: continue

                          if (mimeType.contains("csv") || mimeType.contains("text")) {
                              val csvText = bytes.toString(Charsets.UTF_8)
                              add(buildJsonObject {
                                  put("text", "CSV File Content:\n$csvText")
                              })
                          } else {
                              val b64 = Base64.encodeToString(bytes, Base64.NO_WRAP)
                              val resolvedMime = when {
                                  mimeType.contains("pdf") -> "application/pdf"
                                  mimeType.startsWith("image/") -> mimeType
                                  else -> "image/jpeg"
                              }
                              add(buildJsonObject {
                                  putJsonObject("inline_data") {
                                      put("mime_type", resolvedMime)
                                      put("data", b64)
                                  }
                              })
                          }
                      }
                  }

                  val itemSchema = buildJsonObject {
                      put("type", "OBJECT")
                      putJsonObject("properties") {
                          putJsonObject("isoDate") { put("type", "STRING") }
                          putJsonObject("amount") { put("type", "NUMBER") }
                          putJsonObject("currency") { put("type", "STRING") }
                          putJsonObject("amountInMyr") { put("type", "NUMBER") }
                          putJsonObject("rawMerchantOrRecipient") { put("type", "STRING") }
                          putJsonObject("cleanDisplayName") { put("type", "STRING") }
                          putJsonObject("sourceAccountName") { put("type", "STRING") }
                          putJsonObject("destinationAccountName") { put("type", "STRING"); put("nullable", true) }
                          putJsonObject("transactionType") { put("type", "STRING") }
                          putJsonObject("category") { put("type", "STRING") }
                          putJsonObject("isSelfTransfer") { put("type", "BOOLEAN") }
                      }
                      putJsonArray("required") {
                          add("isoDate"); add("amount"); add("currency"); add("amountInMyr")
                          add("rawMerchantOrRecipient"); add("cleanDisplayName")
                          add("sourceAccountName"); add("transactionType")
                          add("category"); add("isSelfTransfer")
                      }
                  }

                  val arraySchema = buildJsonObject {
                      put("type", "ARRAY")
                      put("items", itemSchema)
                  }

                  val requestPayload = buildJsonObject {
                      putJsonObject("system_instruction") {
                          putJsonArray("parts") { add(buildJsonObject { put("text", systemPrompt) }) }
                      }
                      putJsonArray("contents") {
                          add(buildJsonObject {
                              put("role", "user")
                              put("parts", partsArray)
                          })
                      }
                      putJsonObject("generationConfig") {
                          put("responseMimeType", "application/json")
                          put("responseSchema", arraySchema)
                          put("temperature", 0.1)
                      }
                  }

                  val rawResponse = executeGeminiCall(apiKey, requestPayload.toString())
                  runCatching {
                      json.decodeFromString<List<ExtractedTransactionDto>>(rawResponse)
                  }.getOrElse { emptyList() }
              }

              private fun executeGeminiCall(apiKey: String, jsonBody: String): String {
                  val primaryUrl = "https://generativelanguage.googleapis.com/v1beta/models/$PRIMARY_MODEL_ID:generateContent?key=$apiKey"
                  val req = Request.Builder()
                      .url(primaryUrl)
                      .post(jsonBody.toRequestBody("application/json".toMediaType()))
                      .build()

                  httpClient.newCall(req).execute().use { response ->
                      if (response.isSuccessful) {
                          return extractCandidateText(response.body?.string().orEmpty())
                      }
                  }

                  // Automatic fallback if gemini-3.8-flash endpoint is not yet enabled on the key
                  val fallbackUrl = "https://generativelanguage.googleapis.com/v1beta/models/$FALLBACK_MODEL_ID:generateContent?key=$apiKey"
                  val fallbackReq = Request.Builder()
                      .url(fallbackUrl)
                      .post(jsonBody.toRequestBody("application/json".toMediaType()))
                      .build()

                  httpClient.newCall(fallbackReq).execute().use { response ->
                      val bodyStr = response.body?.string().orEmpty()
                      if (!response.isSuccessful) {
                          throw IllegalStateException("Gemini API Error ${response.code}: $bodyStr")
                      }
                      return extractCandidateText(bodyStr)
                  }
              }

              private fun extractCandidateText(bodyStr: String): String {
                  val root = json.parseToJsonElement(bodyStr).jsonObject
                  return root["candidates"]?.jsonArray?.firstOrNull()
                      ?.jsonObject?.get("content")?.jsonObject
                      ?.get("parts")?.jsonArray?.firstOrNull()
                      ?.jsonObject?.get("text")?.jsonPrimitive?.contentOrNull ?: "[]"
              }

              fun fallbackHeuristicParse(
                  appPackage: String,
                  notificationText: String,
                  areaName: String?
              ): ParsedNotificationDto {
                  val rmRegex = Regex("""(?:RM|MYR)\s*([0-9]+(?:\.[0-9]{1,2})?)""", RegexOption.IGNORE_CASE)
                  val cnyRegex = Regex("""(?:RMB|CNY|¥)\s*([0-9]+(?:\.[0-9]{1,2})?)""", RegexOption.IGNORE_CASE)

                  val rmMatch = rmRegex.find(notificationText)
                  val cnyMatch = cnyRegex.find(notificationText)

                  val (amount, currency, amountMyr) = when {
                      rmMatch != null -> {
                          val v = rmMatch.groupValues[1].toDoubleOrNull() ?: 0.0
                          Triple(v, "MYR", v)
                      }
                      cnyMatch != null -> {
                          val v = cnyMatch.groupValues[1].toDoubleOrNull() ?: 0.0
                          Triple(v, "CNY", v * 0.61)
                      }
                      else -> Triple(0.0, "MYR", 0.0)
                  }

                  val lower = notificationText.lowercase()
                  val isSelf = lower.contains("nicholas soo") ||
                      lower.contains("soo wei ming") ||
                      lower.contains("reload") ||
                      lower.contains("top up")

                  val sourceAcc = when {
                      appPackage.contains("tngdigital") || lower.contains("tng") -> "TNG eWallet"
                      appPackage.contains("spay") || lower.contains("s pay") -> "S Pay Global"
                      appPackage.contains("boc") || lower.contains("bank of china") -> "Bank of China"
                      else -> "Main Bank (MAE)"
                  }

                  val merchant = notificationText.take(45).trim()
                  val display = if (areaName != null && !isSelf) "$merchant @ $areaName" else merchant

                  return ParsedNotificationDto(
                      amount = amount,
                      currency = currency,
                      amountInMyr = amountMyr,
                      rawMerchantOrRecipient = merchant,
                      cleanDisplayName = display,
                      sourceAccountName = sourceAcc,
                      destinationAccountName = if (isSelf) "TNG eWallet" else null,
                      transactionType = if (isSelf) "TRANSFER" else "EXPENSE",
                      category = if (isSelf) "SELF_TRANSFER" else "FOOD_DINING",
                      isSelfTransfer = isSelf,
                      inferredLocationLabel = areaName
                  )
              }

              fun parseIsoDateToEpochMillis(isoString: String): Long {
                  return runCatching {
                      val clean = isoString.trim().take(10)
                      LocalDate.parse(clean, DateTimeFormatter.ISO_LOCAL_DATE)
                          .atStartOfDay(ZoneId.systemDefault())
                          .toInstant()
                          .toEpochMilli() + (12 * 3600 * 1000L)
                  }.getOrElse { System.currentTimeMillis() }
              }
          }
          ''',

              "app/src/main/java/com/nicholas/financetracker/service/TransactionNotificationService.kt": r'''package com.nicholas.financetracker.service

          import android.annotation.SuppressLint
          import android.app.Notification
          import android.content.Context
          import android.content.pm.PackageManager
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import androidx.core.content.ContextCompat
          import com.google.android.gms.location.LocationServices
          import com.google.android.gms.location.Priority
          import com.google.android.gms.tasks.CancellationTokenSource
          import com.nicholas.financetracker.data.local.*
          import com.nicholas.financetracker.data.remote.GeminiFinanceEngine
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.tasks.await
          import kotlinx.coroutines.withTimeoutOrNull
          import java.util.concurrent.ConcurrentHashMap

          class TransactionNotificationService : NotificationListenerService() {

              private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val recentNotificationsCache = ConcurrentHashMap<String, Long>()

              companion object {
                  const val PREFS_NAME = "pulse_finance_prefs"
                  const val KEY_GEMINI_API = "gemini_api_key"

                  private val MONITORED_PACKAGES = setOf(
                      "com.maybank2u.life",
                      "my.com.tngdigital.ewallet",
                      "my.gov.sarawak.paybills",
                      "com.chinamworld.bocmbci",
                      "com.boc.bocop.container",
                      "com.cimb.octo",
                      "com.pbebank.pbeengage",
                      "com.rhbgroup.rhbmobilebanking",
                      "com.hlb.connect.android",
                      "com.grabtaxi.passenger"
                  )

                  private val PAYMENT_KEYWORDS = listOf(
                      "rm", "myr", "cny", "rmb", "paid", "payment", "transfer",
                      "duitnow", "reload", "deducted", "received", "spent", "成功", "支出", "人民币"
                  )
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn == null || sbn.isOngoing) return

                  val pkg = sbn.packageName ?: return
                  val extras = sbn.notification?.extras ?: return
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString().orEmpty()
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString().orEmpty()
                  val bigText = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString().orEmpty()

                  val combinedText = listOf(title, bigText.ifBlank { text })
                      .filter { it.isNotBlank() }
                      .joinToString(" - ")
                      .trim()

                  if (combinedText.length < 6) return

                  val isMonitoredApp = pkg in MONITORED_PACKAGES
                  val hasPaymentKeyword = PAYMENT_KEYWORDS.any { combinedText.contains(it, ignoreCase = true) }
                  val hasDigits = combinedText.any { it.isDigit() }

                  if (!isMonitoredApp && !(hasPaymentKeyword && hasDigits)) return
                  if (!hasPaymentKeyword || !hasDigits) return

                  val dedupKey = "$pkg|$combinedText"
                  val now = System.currentTimeMillis()
                  val previousTime = recentNotificationsCache[dedupKey]
                  if (previousTime != null && (now - previousTime) < 60_000L) return
                  recentNotificationsCache[dedupKey] = now

                  serviceScope.launch {
                      processIncomingTransactionNotification(pkg, combinedText, now)
                  }
              }

              @SuppressLint("MissingPermission")
              private suspend fun fetchCurrentGpsCoordinates(): Pair<Double, Double>? {
                  val hasFine = ContextCompat.checkSelfPermission(
                      this, android.Manifest.permission.ACCESS_FINE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED
                  val hasCoarse = ContextCompat.checkSelfPermission(
                      this, android.Manifest.permission.ACCESS_COARSE_LOCATION
                  ) == PackageManager.PERMISSION_GRANTED

                  if (!hasFine && !hasCoarse) return null

                  val fusedClient = LocationServices.getFusedLocationProviderClient(this)
                  return withTimeoutOrNull(6_000L) {
                      runCatching {
                          val cts = CancellationTokenSource()
                          val loc = fusedClient.getCurrentLocation(Priority.PRIORITY_HIGH_ACCURACY, cts.token).await()
                              ?: fusedClient.lastLocation.await()
                          if (loc != null) Pair(loc.latitude, loc.longitude) else null
                      }.getOrNull()
                  }
              }

              private suspend fun processIncomingTransactionNotification(
                  appPackage: String,
                  rawText: String,
                  timestampMs: Long
              ) {
                  val db = AppDatabase.getInstance(applicationContext)
                  val dao = db.financeDao()
                  val accounts = dao.getAllAccountsOnce()
                  val rules = dao.getAllMerchantRules()

                  val prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                  val apiKey = prefs.getString(KEY_GEMINI_API, "")?.trim().orEmpty()

                  val gps = fetchCurrentGpsCoordinates()

                  val parsed = if (apiKey.isNotBlank()) {
                      GeminiFinanceEngine.parseLiveNotification(
                          apiKey = apiKey,
                          appPackage = appPackage,
                          notificationText = rawText,
                          timestampMs = timestampMs,
                          lat = gps?.first,
                          lon = gps?.second,
                          accounts = accounts,
                          savedRules = rules
                      )
                  } else {
                      GeminiFinanceEngine.fallbackHeuristicParse(appPackage, rawText, null)
                  }
if (parsed.amountInMyr <= 0.0) return

                  val normKey = AppDatabase.normalizeRecipientKey(parsed.rawMerchantOrRecipient)
                  val matchedRule = dao.findRuleForRecipient(normKey)

                  val finalCategory = matchedRule?.assignedCategory ?: parsed.category
                  val finalDisplayName = matchedRule?.customDisplayName ?: parsed.cleanDisplayName
                  val finalIsSelf = matchedRule?.forceSelfTransfer ?: parsed.isSelfTransfer
                  val finalType = if (finalIsSelf) TransactionType.TRANSFER.name else parsed.transactionType

                  val sourceAcc = accounts.find {
                      it.name.equals(parsed.sourceAccountName, ignoreCase = true)
                  } ?: accounts.first()

                  val destAccId = matchedRule?.defaultDestinationAccountId ?: accounts.find {
                      it.name.equals(parsed.destinationAccountName, ignoreCase = true)
                  }?.id

                  val entity = TransactionEntity(
                      timestamp = timestampMs,
                      amount = parsed.amountInMyr,
                      originalAmount = parsed.amount,
                      originalCurrency = parsed.currency,
                      rawMerchantOrRecipient = parsed.rawMerchantOrRecipient,
                      displayName = finalDisplayName,
                      category = finalCategory,
                      transactionType = finalType,
                      isSelfTransfer = finalIsSelf,
                      sourceAccountId = sourceAcc.id,
                      destinationAccountId = if (finalIsSelf) (destAccId ?: accounts.getOrNull(2)?.id) else null,
                      latitude = gps?.first,
                      longitude = gps?.second,
                      locationLabel = parsed.inferredLocationLabel,
                      rawNotificationText = rawText
                  )

                  dao.insertTransactionAndSyncBalances(entity)
              }
          }
          ''',

              "app/src/main/java/com/nicholas/financetracker/ui/EditTransactionSheet.kt": r'''package com.nicholas.financetracker.ui

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Delete
          import androidx.compose.material.icons.filled.SyncAlt
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.nicholas.financetracker.data.local.*

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun EditTransactionSheet(
              transaction: TransactionEntity,
              accounts: List<AccountEntity>,
              onDismiss: () -> Unit,
              onSave: (updatedTx: TransactionEntity, saveAsRule: Boolean) -> Unit,
              onDelete: (TransactionEntity) -> Unit
          ) {
              var displayName by remember { mutableStateOf(transaction.displayName) }
              var amountText by remember { mutableStateOf("%.2f".format(transaction.amount)) }
              var locationLabel by remember { mutableStateOf(transaction.locationLabel.orEmpty()) }
              var selectedCategory by remember {
                  mutableStateOf(TransactionCategory.fromNameOrDefault(transaction.category))
              }
              var isSelfTransfer by remember { mutableStateOf(transaction.isSelfTransfer) }
              var sourceAccountId by remember { mutableLongStateOf(transaction.sourceAccountId) }
              var destinationAccountId by remember {
                  mutableLongStateOf(
                      transaction.destinationAccountId
                          ?: accounts.firstOrNull { it.id != transaction.sourceAccountId }?.id
                          ?: 1L
                  )
              }
              var rememberRuleForFuture by remember { mutableStateOf(true) }

              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  containerColor = Color(0xFF18181B),
                  scrimColor = Color.Black.copy(alpha = 0.65f)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 20.dp)
                          .padding(bottom = 32.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(
                              text = "Edit Transaction",
                              color = Color.White,
                              fontSize = 18.sp,
                              fontWeight = FontWeight.Bold
                          )
                          IconButton(onClick = { onDelete(transaction) }) {
                              Icon(
                                  imageVector = Icons.Default.Delete,
                                  contentDescription = "Delete",
                                  tint = Color(0xFFF43F5E)
                              )
                          }
                      }

                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(12.dp))
                              .background(if (isSelfTransfer) Color(0xFF0C4A6E) else Color(0xFF27272A))
                              .clickable {
                                  isSelfTransfer = !isSelfTransfer
                                  if (isSelfTransfer) {
                                      selectedCategory = TransactionCategory.SELF_TRANSFER
                                  }
                              }
                              .padding(horizontal = 14.dp, vertical = 12.dp),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              Icon(
                                  imageVector = Icons.Default.SyncAlt,
                                  contentDescription = null,
                                  tint = Color(0xFF38BDF8)
                              )
                              Column {
                                  Text(
                                      text = "Flip to Self-Transfer 🔄",
                                      color = Color.White,
                                      fontWeight = FontWeight.SemiBold,
                                      fontSize = 14.sp
